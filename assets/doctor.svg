<svg viewBox="0 0 520 650" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustración de la Dra. Shalim Viza">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#57d3cf"/>
      <stop offset="1" stop-color="#0b7c8c"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f6f6"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2c2a"/>
      <stop offset="1" stop-color="#2c1614"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="520" height="650" fill="url(#bgD)"/>
  <rect width="520" height="650" fill="url(#glow)"/>
  <circle cx="410" cy="120" r="150" fill="#ffffff" opacity="0.08"/>
  <circle cx="90" cy="520" r="120" fill="#ffffff" opacity="0.07"/>

  <!-- decorative sparkles -->
  <g fill="#f4b860" opacity="0.9">
    <path d="M70 110l6 14 14 6-14 6-6 14-6-14-14-6 14-6z"/>
    <path d="M440 470l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
  </g>

  <!-- body / coat -->
  <g>
    <path d="M150 650c0-110 40-190 110-190s110 80 110 190z" fill="url(#coat)"/>
    <!-- coat lapels -->
    <path d="M232 470l28 40 28-40 40 24-30 156h-76l-30-156z" fill="#f0fafa"/>
    <path d="M260 510l-16 130h32z" fill="#dceff0"/>
    <!-- teal scrub collar -->
    <path d="M232 470l28 40-40 30-20-46z" fill="#0e9ca8"/>
    <path d="M288 470l-28 40 40 30 20-46z" fill="#0e9ca8"/>
    <!-- stethoscope -->
    <path d="M300 480c30 10 46 40 40 78" fill="none" stroke="#0d6373" stroke-width="7" stroke-linecap="round"/>
    <circle cx="342" cy="566" r="12" fill="#0d6373"/>
    <circle cx="342" cy="566" r="5" fill="#57d3cf"/>
  </g>

  <!-- neck -->
  <path d="M244 430h32v52h-32z" fill="#e8b48f"/>
  <path d="M244 452c8 12 24 12 32 0v-22h-32z" fill="#d89f7a"/>

  <!-- head -->
  <g>
    <!-- hair back -->
    <path d="M186 330c0-70 34-120 74-120s74 50 74 120c0 30-8 60-20 74l-14-140-80-4-14 144c-12-14-20-44-20-74z" fill="url(#hair)"/>
    <!-- face -->
    <ellipse cx="260" cy="330" rx="62" ry="72" fill="#f0c19b"/>
    <!-- cheeks -->
    <circle cx="224" cy="352" r="12" fill="#eda98a" opacity="0.55"/>
    <circle cx="296" cy="352" r="12" fill="#eda98a" opacity="0.55"/>
    <!-- eyes -->
    <g fill="#2c1614">
      <path d="M228 322c6-8 20-8 26 0" fill="none" stroke="#2c1614" stroke-width="4" stroke-linecap="round"/>
      <path d="M266 322c6-8 20-8 26 0" fill="none" stroke="#2c1614" stroke-width="4" stroke-linecap="round"/>
      <circle cx="241" cy="332" r="5"/>
      <circle cx="279" cy="332" r="5"/>
    </g>
    <!-- smile -->
    <path d="M240 362c8 12 32 12 40 0" fill="none" stroke="#b5623f" stroke-width="4" stroke-linecap="round"/>
    <!-- hair front -->
    <path d="M198 320c2-64 34-110 62-110s60 46 62 110c-18-26-30-52-30-52s-18 34-52 40c-20 4-34 8-42 12z" fill="url(#hair)"/>
  </g>

  <!-- name plate -->
  <g>
    <rect x="150" y="596" width="220" height="40" rx="20" fill="#ffffff" opacity="0.92"/>
    <text x="260" y="622" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#0b7c8c" font-weight="700">Dra. Shalim Viza</text>
  </g>
</svg>
