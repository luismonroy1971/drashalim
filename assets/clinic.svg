<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Consultorio odontológico moderno">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eafcfb"/>
      <stop offset="1" stop-color="#cbf3f0"/>
    </linearGradient>
    <linearGradient id="chair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e9ca8"/>
      <stop offset="1" stop-color="#0b7c8c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="520" fill="url(#wall)"/>
  <!-- floor -->
  <rect y="400" width="800" height="120" fill="#bfe9e6"/>
  <path d="M0 400h800l-40 120H40z" fill="#a9dfdb" opacity="0.5"/>

  <!-- window with light -->
  <rect x="70" y="70" width="200" height="150" rx="10" fill="#ffffff" opacity="0.8"/>
  <rect x="70" y="70" width="200" height="150" rx="10" fill="none" stroke="#98e6e2" stroke-width="6"/>
  <line x1="170" y1="70" x2="170" y2="220" stroke="#98e6e2" stroke-width="6"/>
  <line x1="70" y1="145" x2="270" y2="145" stroke="#98e6e2" stroke-width="6"/>

  <!-- plant -->
  <rect x="120" y="330" width="46" height="70" rx="6" fill="#f4b860"/>
  <g fill="#22b6b6">
    <path d="M143 330c-30-10-40-50-40-50s40 6 40 50z"/>
    <path d="M143 330c30-10 40-50 40-50s-40 6-40 50z"/>
    <path d="M143 335c0-40 0-70 0-70s16 30 0 70z"/>
  </g>

  <!-- dental chair -->
  <g>
    <!-- base -->
    <rect x="470" y="380" width="120" height="24" rx="8" fill="#0d6373"/>
    <rect x="518" y="330" width="24" height="60" fill="#0d6373"/>
    <!-- seat -->
    <rect x="440" y="300" width="180" height="46" rx="20" fill="url(#chair)"/>
    <!-- backrest -->
    <rect x="560" y="180" width="60" height="150" rx="26" fill="url(#chair)"/>
    <!-- headrest -->
    <rect x="566" y="150" width="48" height="44" rx="16" fill="#0b7c8c"/>
    <!-- leg rest -->
    <rect x="400" y="316" width="70" height="34" rx="16" fill="#0e9ca8"/>
  </g>

  <!-- overhead lamp -->
  <g>
    <line x1="640" y1="60" x2="640" y2="140" stroke="#9fd8d4" stroke-width="8"/>
    <ellipse cx="600" cy="160" rx="70" ry="26" fill="#0d6373"/>
    <ellipse cx="600" cy="154" rx="60" ry="20" fill="#eafcfb"/>
    <circle cx="580" cy="154" r="6" fill="#ffffff"/>
    <circle cx="600" cy="154" r="6" fill="#ffffff"/>
    <circle cx="620" cy="154" r="6" fill="#ffffff"/>
    <path d="M600 176 L560 300 H640 Z" fill="#ffffff" opacity="0.25"/>
  </g>

  <!-- monitor / cabinet -->
  <rect x="300" y="250" width="110" height="70" rx="8" fill="#ffffff"/>
  <rect x="312" y="262" width="86" height="46" rx="4" fill="#57d3cf"/>
  <path d="M330 300h50l-6-30h-38z" fill="#0e9ca8" opacity="0.6"/>
  <rect x="345" y="320" width="20" height="20" fill="#dfeff0"/>
  <rect x="325" y="340" width="60" height="8" rx="4" fill="#c4e6e4"/>

  <!-- tooth logo on wall -->
  <g transform="translate(690,90)" fill="#22b6b6" opacity="0.9">
    <path d="M20 4c-6-4-14-4-18 1C-2 11 0 22 3 32c1.6 5 2.6 12 5 15 2 2.6 5 1.6 6-2 1-3.4 1.6-9 4-11 2.4-2 6-2 8 0 2.4 2 3 7.6 4 11 1 3.6 4 4.6 6 2 2.4-3 3.4-10 5-15 3-10 5-21-1-27-4-5-12-5-18-1z"/>
  </g>
</svg>
